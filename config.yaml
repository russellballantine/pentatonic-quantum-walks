# ==============================================================================
# P-QW CONFIGURATION MATRIX: QUANTUM WALK & LATTICE SWEEP INPUTS
# ==============================================================================

global_system:
  lattice_size: 201               # System size (N) for space-time dynamics
  spectral_lattice_size: 1000     # Enlarged N needed for stable box-counting
  kinetic_coupling: 1.0           # Hopping bandwidth parameter (J)
  potential_amplitude: 1.5         # Sub-critical Aubry-André potential scale (Lambda)

evolution_time:
  max_time: 50.0                  # Temporal boundaries (t_max)
  time_step: 0.5                  # Temporal steps (dt)

topological_phases:
  periodic_baseline:
    alpha: 0.0
    label: "Periodic Matrix Baseline (alpha=0.0)"
  symmetric_rational:
    alpha: 0.25
    label: "Symmetric Rational Lattice (alpha=0.25)"
  incommensurate_alpha:
    alpha: 0.3219280948873623       # log2(1.25)
    label: "Incommensurate Phase Alpha (Major-Thirds Derived)"
  incommensurate_beta:
    alpha: 0.5849625007211562       # log2(1.5)
    label: "Incommensurate Phase Beta (Spiral-of-Fifths Derived)"
# ==============================================================================
# DISORDER SWEEP CONFIGURATION MATRIX
# ==============================================================================
disorder_system:
  disorder_samples: 50            # Number of random structural iterations to average
  noise_amplitude: 0.3            # Magnitude of random kinetic fluctuation (delta_J)
  evaluation_time: 30.0           # Static snap time to measure localized footprint

